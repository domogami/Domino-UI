name: Build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      # Match package-lock.json; browser binaries and OS libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check browser image version
        run: node -e "if (require('@playwright/test/package.json').version !== '1.64.1') throw new Error('Keep the CI image matched to package-lock.json');"
      - run: npm run check
      - run: npm run test:system
      - run: npm run test:package
      - run: npm test
      - run: npm run test:production
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
