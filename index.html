<!doctype html>
<html lang="en" data-theme="hybrid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b3034" />
    <meta
      name="description"
      content="Domino UI — a living React component library and design field guide. Paper, ink, and a little curiosity."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://ui.dominicklee.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Domino UI — The component notebook" />
    <meta
      property="og:description"
      content="Paper, ink, and a little curiosity. A living design system by Dom Lee, with React components and a visual field guide."
    />
    <meta property="og:url" content="https://ui.dominicklee.net/" />
    <meta
      property="og:image"
      content="https://ui.dominicklee.net/social-cover.png"
    />
    <meta
      property="og:image:alt"
      content="Domino UI: a notebook of paper, ink, teal accents, and handmade components."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Domino UI — The component notebook</title>
    <script>
      try {
        const t = localStorage.getItem("domino-theme");
        if (["light", "dark", "hybrid"].includes(t))
          document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
